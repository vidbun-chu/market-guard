[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-guard"
version = "1.0.0"
description = "账户级风控与趋势工具包：多源行情、市值止损三轨制、趋势引擎、大周期定性三问"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["risk-management", "stop-loss", "trading", "a-share", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []          # 零第三方依赖，仅用标准库

[project.scripts]
market-guard = "market_guard.__main__:main"

[tool.setuptools.packages.find]
include = ["market_guard*"]
